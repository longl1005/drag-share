[package]
name = "drag-share"
version = "0.1.1"
description = "SMB Share Assistant"
authors = ["drag-share"]
edition = "2021"
rust-version = "1.92"

[lib]
name = "drag_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# macOS 27 dyld rejects string tables produced by stripping host proc-macro dylibs.
# Keep build-time host libraries intact; the shipped executable remains stripped.
[profile.release.build-override]
strip = false
